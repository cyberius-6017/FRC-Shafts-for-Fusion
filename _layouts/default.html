<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    
    <style>
        @font-face {
            font-family: 'AvenirCustom';
            src: url('{{ "/fonts/AvenirNext-Regular.woff2" | relative_url }}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body { 
            font-family: 'AvenirCustom', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            line-height: 1.6; 
            color: #0f172a; 
            margin: 0; 
            background: #f8fafc; 
        }
        
        header { 
            background: #ffffff; 
            color: #0f172a; 
            padding: 4rem 5%; 
            text-align: center; 
            border-bottom: 5px solid #006eb6; 
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }
        header h1 { 
            margin: 0 0 0.5rem 0; 
            font-size: 2.5rem; 
            color: #0f172a; 
        }
        header p { 
            font-size: 1.2rem; 
            margin: 0; 
            color: #006eb6; 
            font-weight: 600;
        }

        main { 
            max-width: 800px; 
            margin: 3rem auto; 
            background: #ffffff; 
            padding: 3rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); 
        }
        
        h1, h2, h3, h4 { 
            color: #0f172a; 
            margin-top: 2.5rem; 
        }
        a { 
            color: #006eb6; 
            text-decoration: none; 
            font-weight: 700; 
        }
        a:hover { 
            color: #4fc3ff; 
            text-decoration: underline; 
        }
        code { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0;
            padding: 0.2rem 0.4rem; 
            border-radius: 3px; 
            font-family: monospace; 
            color: #006eb6;
        }
        hr { 
            border: 0; 
            border-top: 1px solid #e2e8f0; 
            margin: 2rem 0; 
        }
        
        .btn {
            display: inline-block;
            background: #006eb6;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s ease;
            border: none;
        }
        .btn:hover {
            background: #4fc3ff;
            color: #0f172a; 
            text-decoration: none;
            transform: translateY(-1px);
        }

        footer { 
            text-align: center; 
            padding: 2rem; 
            color: #0f172a; 
            font-size: 0.9rem; 
            opacity: 0.8; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Vendor Shaft Add-in</h1>
        <p>{{ site.description }}</p>
    </header>
    
    <main>
        {{ content }}
    </main>

    <footer>
        <p>
            Add-in developed by Pepe Santillan
            <br>
            Site developed by Ciberius 6017
        </p>
    </footer>
</body>
</html>
