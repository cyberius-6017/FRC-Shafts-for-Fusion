<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>

    <link rel="icon" type="image/png" href="{{ '/images/favicon.ico' | relative_url }}">

    <style>
        * {
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'AvenirCustom';
            src: url('{{ "/fonts/AvenirNext-Regular.woff2" | relative_url }}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'AvenirCustom', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #0f172a;
            margin: 0;
            background: #f8fafc;
            overflow-x: hidden;
            overflow-wrap: anywhere;
        }

        header {
            background: #c9edff;
            color: #0f172a;
            padding: 4rem 5%;
            text-align: center;
            border-bottom: 5px solid #006eb6;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }

        .header-logo {
            width: 85px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
        }

        header h1 {
            margin: 0 0 0.2rem 0;
            font-size: 2.5rem;
            color: #006eb6;
            /* Cyber Dark for maximum readability */
            line-height: 1.1;
        }

        header p {
            font-size: 1.2rem;
            margin: 0;
            color: #006eb6;
            /* Primary Blue */
            font-weight: 800;
        }

        main {
            max-width: 800px;
            width: 90%;
            /* Ensures the box never touches the absolute edge of the screen */
            margin: 3rem auto;
            background: #ffffff;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        main p {
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        h1,
        h2,
        h3,
        h4 {
            color: #0f172a;
            margin-top: 2.5rem;
        }

        main .text-center {
            text-align: center !important;
        }

        a {
            color: #006eb6;
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            color: #4fc3ff;
            text-decoration: underline;
        }

        code {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            color: #006eb6;
        }

        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 2rem 0;
        }

        main img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
            display: block;
            margin: 1.5rem auto;
        }

        .btn {
            display: block;
            width: fit-content;
            margin: 2rem auto;
            background: #006eb6;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s ease;
            border: none;
        }

        .btn:hover {
            background: #4fc3ff;
            color: #0f172a;
            text-decoration: none;
            transform: translateY(-1px);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 2rem;
            color: #0f172a;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            header {
                padding: 3rem 5%;
            }

            header h1 {
                font-size: 1.8rem;
            }

            main {
                width: 95%;
                margin: 1.5rem auto;
                padding: 1.5rem;
            }

            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>FRC Shafts & Spacers Add-In</h1>
        <p>{{ site.description }}</p>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>
            Add-in developed by Pepe Santillan
            <br>
            Site developed by Cyberius 6017
        </p>
    </footer>
</body>

</html>
