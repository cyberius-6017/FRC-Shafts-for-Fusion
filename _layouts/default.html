<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; margin: 0; background: #f4f5f6; }
        header { background: #0696D7; color: white; padding: 4rem 5%; text-align: center; }
        header h1 { margin: 0 0 0.5rem 0; font-size: 2.5rem; }
        header p { font-size: 1.2rem; opacity: 0.9; margin: 0; }
        main { max-width: 800px; margin: -2rem auto 2rem; background: white; padding: 3rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2, h3 { color: #222; margin-top: 2rem; }
        a { color: #0696D7; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        code { background: #f4f4f4; padding: 0.2rem 0.4rem; border-radius: 3px; font-family: monospace; }
        hr { border: 0; border-top: 1px solid #eaeaea; margin: 2rem 0; }
        footer { text-align: center; padding: 2rem; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>
    </header>
    
    <main>
        {{ content }}
    </main>

    <footer>
        <p>Developed by Cybreius 6017</p>
    </footer>
</body>
</html>
